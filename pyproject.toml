[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-bridge"
version = "0.1.0"
description = "Supervise the Pi coding agent from any orchestrator over HTTP: fire-and-forget dispatch, signed push callbacks, watchdog, heartbeat."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["pi", "coding-agent", "orchestrator", "webhook", "supervisor"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.scripts]
pi-bridge = "pi_bridge:main"

[project.urls]
Documentation = "https://github.com/wicahma/pi-bridge/blob/main/docs/PROTOCOL.md"

[tool.setuptools]
py-modules = ["pi_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
